[project]
name = "uber-clone-django"
version = "0.1.0"
description = "Django/DRF sibling of uber_clone: the same ride-hailing domain, built with idiomatic Django instead of Kotlin/Spring or FastAPI. Fare/surge quoting is an in-process module here, not the separate gRPC service the Kotlin original uses."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.2",
    "djangorestframework>=3.15",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "psycopg[binary]>=3.2",
    # celery[redis] (via kombu) caps this to <6.5 — kept unpinned here rather than forcing a
    # newer redis-py that celery can't yet install alongside.
    "redis>=5.0,<6.5",
    "celery[redis]>=5.6.3",
    "kafka-python-ng>=2.2",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "djangorestframework-stubs[compatible-mypy]>=3.15",
    "celery-types>=0.22",
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-django>=4.9",
    # >=4.15 specifically: that's where testcontainers.community.{postgres,redis,kafka} (used by
    # tests/conftest.py) live — older 4.13.x keeps those same containers at the top level instead.
    # Deliberately NOT requesting testcontainers' own "redis" extra: that extra pins redis>=7,
    # which conflicts with celery[redis]'s redis<6.5 pin. RedisContainer itself only needs
    # whatever `redis` package this project already installs for its own client (rides/redis_client.py)
    # to be present at all — it doesn't require a specific version.
    "testcontainers[postgres,kafka]>=4.15",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["config*", "rides*"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["config", "rides", "tests"]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
# manage.py is a stock Django entrypoint script, not worth strict-typing.
module = "manage"
ignore_errors = true

[[tool.mypy.overrides]]
# kafka-python-ng ships no type stubs at all, same situation the FastAPI sibling documented for
# aiokafka (see kafka_producer.py/kafka_bridge.py for the casts this makes necessary).
module = "kafka.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 110
src = ["config", "rides", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["config", "rides"]

[tool.ruff.lint.flake8-bugbear]
# DRF's class-based views assign permission_classes/authentication_classes as class-level list
# attributes, not function defaults, so B008 doesn't apply here the way it does for FastAPI's
# Depends() pattern in the sibling repo — nothing to extend-immutable-calls for in this project.

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]
